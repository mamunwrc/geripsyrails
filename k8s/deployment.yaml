apiVersion: apps/v1
kind: Deployment
metadata:
  name: geripsy-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geripsy-app
  template:
    metadata:
      labels:
        app: geripsy-app
    spec:
      containers:
      - name: geripsy-app
        image: mamunacr.azurecr.io/geripsy-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: rails-secrets
              key: SECRET_KEY_BASE
---
apiVersion: v1
kind: Service
metadata:
  name: geripsy-service
spec:
  type: LoadBalancer
  selector:
    app: geripsy-app
  ports:
  - port: 80
    targetPort: 3000
